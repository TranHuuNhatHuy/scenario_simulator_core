component: vehicle
title: Vehicle
description: >
  The vehicle interface boundary. Under scenario_simulator these reports are produced by the
  simulator's ego model rather than by hardware, which makes them the cleanest available check
  that the loop is closed at all: a control command that never reaches the vehicle shows up as a
  velocity report that never changes.

  autoware_core_vehicle itself contributes robot_state_publisher (TF), which nothing here can
  observe as a topic contract; it is covered indirectly, since a missing base_link transform makes
  localization and planning fail immediately.

interfaces:
  - name: /vehicle/status/velocity_status
    direction: output
    required_in: [P0, P2, P3]
    rate: {min_hz: 20.0, max_hz: 200.0}
    max_gap_s: 0.25
    checks: [finite]
    note: Drives vehicle_velocity_converter, and through it gyro_odometer and the EKF.

  - name: /vehicle/status/steering_status
    direction: output
    required_in: [P0, P2, P3]
    rate: {min_hz: 20.0, max_hz: 200.0}
    max_gap_s: 0.25
    checks: [finite]

  - name: /vehicle/status/control_mode
    direction: output
    required_in: [P0, P2, P3]
    rate: {min_hz: 0.0}
    note: >
      Must read AUTONOMOUS once engaged. If it stays MANUAL the vehicle ignores every command
      while every rate check still passes -- the classic "everything is green and nothing moves".

  - name: /vehicle/status/gear_status
    direction: output
    required_in: [P0, P2, P3]
    rate: {min_hz: 0.0}

metrics:
  - name: vehicle_velocity_status_rate_hz
    unit: Hz
    interface: /vehicle/status/velocity_status
    statistic: rate_hz
    gate: {min: 20.0}
    required_in: [P0, P2, P3]

  - name: vehicle_steering_status_rate_hz
    unit: Hz
    interface: /vehicle/status/steering_status
    statistic: rate_hz
    gate: {min: 20.0}
    required_in: [P0, P2, P3]

  - name: vehicle_velocity_status_max_gap_s
    unit: s
    interface: /vehicle/status/velocity_status
    statistic: max_gap_s
    gate: {max: 0.25}
    required_in: [P0, P2, P3]

  - name: vehicle_control_mode_available
    unit: bool
    interface: /vehicle/status/control_mode
    statistic: observed
    gate: {min: 1.0}
    required_in: [P0, P2, P3]
